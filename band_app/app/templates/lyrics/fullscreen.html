<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ song_name }} - Lyrics (Full Screen)</title>
    <link rel="stylesheet" href="/static/css/band-theme.css">
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
</head>
<body class="lyrics-fullscreen-container">
    <div class="lyrics-header">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
                <h1 class="band-title" style="font-size: 1.4rem; margin: 0;">{{ song_name }}</h1>
                {% if artist or bpm or song_key %}
                <div class="text-muted" style="font-size: 0.85rem; margin-top: 0.2rem;">
                    {{ artist }}{% if bpm %} · ({{ bpm }} BPM){% endif %}{% if song_key %} · <span style="color: var(--primary); font-weight: 700;">Key: {{ song_key }}</span>{% endif %}{% if duration %} · {{ duration }}s{% endif %}
                </div>
                {% endif %}
            </div>
            <a href="/api/lyrics/{{ song_name }}" class="band-btn-secondary" style="display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.4rem 0.8rem;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                <span>Exit</span>
            </a>
        </div>
    </div>

    <div class="lyrics-content fade-in-up" id="fullscreen-lyrics-body">
        {{ lyrics_content | safe }}
    </div>

    <!-- Floating Autoscroll Control Bar -->
    <div class="lyrics-floating-autoscroll">
        <div class="autoscroll-bar">
            <!-- Progress Line Track -->
            <div class="autoscroll-progress-track">
                <div class="autoscroll-progress-fill"></div>
            </div>


            <!-- Play / Pause Button -->
            <button class="autoscroll-btn autoscroll-play-btn" title="Play/Pause Autoscroll (Space)">
                <svg class="icon-play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                <svg class="icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                <span class="autoscroll-text">Play</span>
            </button>

            <!-- Speed Control Group -->
            <div class="autoscroll-speed-group">
                <button class="autoscroll-speed-btn autoscroll-slower-btn" title="Slower (-)">−</button>
                <span class="autoscroll-speed-badge">1.0x</span>
                <button class="autoscroll-speed-btn autoscroll-faster-btn" title="Faster (+)">+</button>
            </div>
        </div>
    </div>

    <script src="/static/js/autoscroll.js"></script>
    <script>
        window.initLyricsAutoscroll({
            containerSelector: '#fullscreen-lyrics-body',
            durationSeconds: {{ duration if duration else 240 }},
            bpm: {{ bpm if bpm else 'null' }},
            speed: 1.0
        });
    </script>
</body>
</html>
