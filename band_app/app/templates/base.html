<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Conspiracy Hub{% endblock %}</title>

    <!-- Theme CSS -->
    <link rel="stylesheet" href="/static/css/band-theme.css">

    <!-- HTMX for no-refresh interactions -->
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>

    {% block head_extra %}{% endblock %}
</head>

<body>
    <!-- Navigation -->
    <nav class="band-nav">
        <div class="nav-inner">
            <div class="nav-header">
                <a href="/" class="nav-brand">🎸 The Conspiracy Hub</a>
                <button class="nav-toggle" id="menu-toggle" aria-label="Toggle navigation">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>

            <div class="nav-links" id="nav-menu">
                <a href="/" class="nav-link {% if active_page == 'home' %}active{% endif %}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Home</span>
                </a>
                <a href="/api/lyrics/" class="nav-link {% if active_page == 'lyrics' %}active{% endif %}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                    <span>Lyrics</span>
                </a>
                <a href="/api/songs/" class="nav-link {% if active_page == 'songs' %}active{% endif %}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    <span>Songs</span>
                </a>
                <a href="/api/setlists/" class="nav-link {% if active_page == 'setlists' %}active{% endif %}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
                    <span>Setlists</span>
                </a>
                <a href="/api/builder/" class="nav-link {% if active_page == 'builder' %}active{% endif %}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z"/><path d="M10 15V6a2 2 0 0 1 4 0v9"/><path d="M4 15v-3a8 8 0 0 1 16 0v3"/></svg>
                    <span>Setlist Builder</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Loading indicator -->
    <div id="loading" class="htmx-indicator">
        <div class="loading-bar"></div>
    </div>

    <!-- Main content area -->
    <main class="container py-lg">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% block footer %}
    <div class="page-footer">
        <div class="footer-logo-wrap">
            <img src="/static/img/bc_logo.svg" alt="Buckingham Conspiracy" class="footer-band-logo">
        </div>
        <div class="footer-text">❤️ Buckingham Forever</div>
    </div>
    {% endblock %}

    <!-- Mobile menu script -->
    <script>
        document.getElementById('menu-toggle')?.addEventListener('click', function () {
            document.getElementById('nav-menu')?.classList.toggle('open');
        });

        // Hide mobile menu on nav click
        document.querySelectorAll('.nav-link').forEach(function (link) {
            link.addEventListener('click', function () {
                if (window.innerWidth < 600) {
                    document.getElementById('nav-menu')?.classList.remove('open');
                }
            });
        });
    </script>

    {% block scripts_extra %}{% endblock %}
</body>

</html>
